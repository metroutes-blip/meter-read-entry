# Builds LVB.apk, the Android install file: the web files in this repo inside a Capacitor shell.
# A v* tag publishes it on a GitHub Release; any other run keeps it as a build artifact.
name: Android app

on:
  workflow_dispatch:
  push:
    tags: ['v*']
    branches: [android-app]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Collect the web files
        run: |
          mkdir www
          cp -R index.html app.js styles.css manifest.json icons vendor www/

      - name: Create the Android project
        run: |
          npm install
          npx cap add android
          npx cap sync android

      - name: Version, permissions and icons
        run: |
          VERSION=$(sed -n "s/^const APP_VERSION = '\(.*\)';/\1/p" app.js)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"$VERSION\"/" android/app/build.gradle
          grep -n "versionCode\|versionName" android/app/build.gradle

          # Location for saving meter positions; storage only for Documents / LVB on older Android.
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-feature android:name="android.hardware.location.gps" android:required="false" />\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29" />\n</manifest>#' "$M"
          sed -i 's#<application#<application android:requestLegacyExternalStorage="true"#' "$M"
          cat "$M"

          # Launcher icon and launch screen from the app's own icon.
          sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick
          RES=android/app/src/main/res
          rm -rf "$RES/mipmap-anydpi-v26"
          for d in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            for f in ic_launcher ic_launcher_round; do
              convert icons/icon-512.png -resize "${d#*:}x${d#*:}" "$RES/mipmap-${d%:*}/$f.png"
            done
            rm -f "$RES/mipmap-${d%:*}/ic_launcher_foreground.png"
          done
          find "$RES" -name splash.png | while read -r f; do
            size=$(identify -format '%wx%h' "$f")
            convert -size "$size" 'xc:#f3f5f7' \( icons/icon-512.png -resize 192x192 \) -gravity center -composite "$f"
          done

      - name: Build
        working-directory: android
        run: ./gradlew --no-daemon assembleRelease

      - name: Sign
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::The signing key is not set up: add the ANDROID_KEYSTORE_B64 and ANDROID_KEYSTORE_PASSWORD repo secrets (see README)."
            exit 1
          fi
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/lvb.p12"
          "$BT/zipalign" -f -p 4 android/app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/lvb.p12" --ks-type PKCS12 --ks-key-alias lvb \
            --ks-pass env:KEYSTORE_PASSWORD --out LVB.apk aligned.apk
          "$BT/apksigner" verify --print-certs LVB.apk
          rm -f "$RUNNER_TEMP/lvb.p12"
          ls -la LVB.apk

      - uses: actions/upload-artifact@v4
        with:
          name: LVB-${{ env.VERSION }}
          path: LVB.apk

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" LVB.apk --title "LVB $VERSION" \
            --notes "Android install file for LVB $VERSION. Open LVB.apk on the tablet to install or update; routes and reads are kept."
